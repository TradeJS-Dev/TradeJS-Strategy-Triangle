<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Ascending Triangle breakout signal</title>
  <desc id="desc">Price makes equal highs and rising lows, then breaks resistance. The target equals the starting triangle height and the stop is below the opposite boundary.</desc>
  <rect width="960" height="420" fill="#ffffff" />
  <g stroke="#eef2f7" stroke-width="1">
    <line x1="40" y1="80" x2="920" y2="80" />
    <line x1="40" y1="160" x2="920" y2="160" />
    <line x1="40" y1="240" x2="920" y2="240" />
    <line x1="40" y1="320" x2="920" y2="320" />
    <line x1="160" y1="40" x2="160" y2="380" />
    <line x1="320" y1="40" x2="320" y2="380" />
    <line x1="480" y1="40" x2="480" y2="380" />
    <line x1="640" y1="40" x2="640" y2="380" />
    <line x1="800" y1="40" x2="800" y2="380" />
  </g>
  <path d="M80 335 L145 150 L215 300 L285 148 L355 265 L430 151 L500 235 L575 150 L645 205 L720 148 L760 112 L815 72 L875 50" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M130 150 L735 150" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" />
  <path d="M130 315 L735 150" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" />
  <path d="M758 150 L758 68" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="8 7" />
  <path d="M740 68 L900 68" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="8 7" />
  <path d="M740 178 L900 178" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="8 7" />
  <g font-family="Inter, Arial, sans-serif" font-size="15" fill="#111827">
    <text x="145" y="135">resistance</text>
    <text x="235" y="292">rising support</text>
    <text x="772" y="126" fill="#16a34a" font-weight="700">LONG breakout</text>
    <text x="830" y="58" fill="#16a34a">target</text>
    <text x="830" y="198" fill="#dc2626">stop</text>
  </g>
  <g fill="#2563eb">
    <circle cx="145" cy="150" r="5" />
    <circle cx="285" cy="148" r="5" />
    <circle cx="430" cy="151" r="5" />
    <circle cx="575" cy="150" r="5" />
    <circle cx="720" cy="148" r="5" />
    <circle cx="215" cy="300" r="5" />
    <circle cx="355" cy="265" r="5" />
    <circle cx="500" cy="235" r="5" />
    <circle cx="645" cy="205" r="5" />
  </g>
</svg>
