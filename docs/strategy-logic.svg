<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Ascending, descending and symmetric Triangle patterns</title>
  <desc id="desc">Three panels show converging price boundaries and their conventional breakout directions.</desc>
  <rect width="960" height="360" fill="#ffffff" />
  <g font-family="Inter, Arial, sans-serif" fill="#111827">
    <text x="160" y="38" text-anchor="middle" font-size="20" font-weight="700">Ascending</text>
    <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="700">Descending</text>
    <text x="800" y="38" text-anchor="middle" font-size="20" font-weight="700">Symmetric</text>
  </g>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="320" y1="20" x2="320" y2="330" />
    <line x1="640" y1="20" x2="640" y2="330" />
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round">
    <path d="M50 105 L270 105" />
    <path d="M50 270 L270 105" />
    <path d="M370 105 L590 270" />
    <path d="M370 270 L590 270" />
    <path d="M690 95 L910 185" />
    <path d="M690 275 L910 185" />
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2">
    <path d="M55 245 L86 125 L117 230 L150 110 L182 205 L215 108 L247 170" />
    <path d="M375 130 L408 250 L440 150 L473 268 L505 178 L538 270 L570 220" />
    <path d="M695 250 L727 115 L759 230 L791 135 L823 215 L855 155 L887 195" />
  </g>
  <g fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M247 170 L286 80" />
    <path d="M278 92 L286 80 L290 95" />
    <path d="M887 195 L925 130" />
    <path d="M916 141 L925 130 L928 145" />
  </g>
  <g fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M570 220 L610 300" />
    <path d="M598 291 L610 300 L610 285" />
    <path d="M887 195 L925 250" />
    <path d="M913 242 L925 250 L923 235" />
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">
    <text x="160" y="322" text-anchor="middle">flat resistance + rising lows</text>
    <text x="480" y="322" text-anchor="middle">falling highs + flat support</text>
    <text x="800" y="322" text-anchor="middle">falling highs + rising lows</text>
  </g>
</svg>
